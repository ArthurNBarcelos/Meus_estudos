<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family:  Verdana, Geneva, Tahoma, sans-serif;
        }
        table, td {
            border: 2px solid black;
            width: 600px;
            height: 200px;
            border-collapse: collapse;
            padding: 2px;
        }
        tr.cor1 {
            background-color: gainsboro;
        }
        td {
            text-align: right;
            vertical-align: bottom;
        }
    </style>
</head>
<body>
    <!-- 
    Table
        Table Header
        Table Row (td)
            Table Data (td)
    -->
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="cor1">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
    </table>
</body>
</html>
