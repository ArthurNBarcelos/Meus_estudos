<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form_004</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastros.js" method="get">
        <p>
            <label for="on1">Número 1:</label>
            <input type="number" name="n1" id="in1" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="on2">Número 2:</label>
            <input type="number" name="n2" id="in2" min="0"     max="50" required oninput ="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="isoma">Soma:</label>
            <output name="soma" id="isoma">0</output> <!--Serve apenas para exibir o resultado, não envia dados pro servidor-->
        </p>
        <p>
            <label for="ipnts">Pontuação:</label>
            <input type="range" name="pnts" id="ipnts" min="0" max="10" value="5" oninput="ipnt.innerHTML = Number(ipnts.value)">
            <output id="ipnt">5</output>
        </p>
    </form>
</body>
</html>
