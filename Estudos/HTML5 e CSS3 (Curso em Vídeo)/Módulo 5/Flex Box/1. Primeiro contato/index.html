<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: #ccc;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            /*
            flex-direction:
            row (esq -> dir)
            row-reverse (dir -> esq)
            column (cima -> baixo)
            column-reverse (baixo -> cima)
            */
        }
        div.item{
            background-color: #f00;
            border: 1px solid #000;
            flex: auto;
            text-align: center;
            margin: 5px;
            &&:hover{
                background-color: #0f0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">AaAaAa</div>
        <div class="item">BbBbBb</div>
        <div class="item">CcCcCc</div>
        <div class="item">DdDdDd</div>
        <div class="item">EeEeEe</div>
        <div class="item">FfFfFf</div>
        <div class="item">GgGgGg</div>
    </div>
</body>
</html>
